<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="工具链数据流图"><style><![CDATA[
  /* 图内样式（PPT 投影口径：字号 / 画布宽 ≥ 1.5%，投影等效 ≥ 14pt） */
  .f-t{font-size:19px; font-weight:700; fill:#0F172A}
  .f-t2{font-size:17px; font-weight:700; fill:#1E293B}
  .f-s{font-size:14px; fill:#334155}
  .f-xs{font-size:13px; fill:#64748B}
  .f-lbl{font-size:15px; font-weight:700; fill:#475569; letter-spacing:.12em}
  .f-mono{font-family:ui-monospace,Consolas,monospace; font-size:14px; font-weight:700}
  .f-file{font-family:ui-monospace,Consolas,monospace; font-size:11px; fill:#94A3B8}
  .ar{stroke:#475569; stroke-width:2.6; fill:none}
  .k-data{fill:#EEF2FF; stroke:#818CF8; stroke-width:1.6}
  .k-core{fill:#F6FFFD; stroke:#0D9488; stroke-width:2.5}
  .k-out{fill:#CCFBF1; stroke:#0D9488; stroke-width:2.5}
  .k-note{fill:#FFFBEB; stroke:#F59E0B; stroke-width:2.5; stroke-dasharray:6 5}
  .ln-fb{stroke:#D97706; stroke-width:2.6; fill:none; stroke-dasharray:6 5}
]]></style>
  <!-- 底色画在 SVG 内部（不用 body 规则），避免嵌入 HTML 时污染页面背景 -->
  <rect width="880" height="500" fill="#E8EDF4"/>

  <text class="f-lbl" x="30" y="32">图 3 ｜ TOOLCHAIN DATA FLOW</text>

  <!-- ── 上挂：可视化验证（核心环节，挂在核心算法之后） ── -->
  <g filter="url(#glow3)">
    <rect class="k-core" x="52" y="60" width="440" height="92" rx="10"/>
  </g>
  <text class="f-mono" x="272" y="90" text-anchor="middle" style="fill:#0F766E">visualize_cameras.py</text>
  <text class="f-s" x="272" y="115" text-anchor="middle">3D 空间分布 + 极坐标角度分布</text>
  <text class="f-s" x="272" y="138" text-anchor="middle">裁剪前后对比 → 300 dpi PNG（看图即验）</text>
  <line class="ar" x1="272" y1="156" x2="272" y2="180" marker-end="url(#ah2)"/>

  <!-- ── 主链：输入 → 核心算法 → 格式生成 → 编码封装 → 成品 ── -->
  <rect x="30" y="184" width="820" height="166" rx="12"
        style="fill:#F8FAFC;fill-opacity:0.9;stroke:#DFE5EC;stroke-width:1.4;stroke-dasharray:5 4"/>

  <!-- 1 输入数据 -->
  <rect class="k-data" x="30" y="200" width="148" height="88" rx="9"/>
  <text class="f-t2" x="104" y="236" text-anchor="middle" style="fill:#3730A3">输入数据</text>
  <text class="f-s" x="104" y="259" text-anchor="middle" style="fill:#4F46E5">UWA · COLMAP</text>
  <text class="f-s" x="104" y="279" text-anchor="middle" style="fill:#4F46E5">实拍产出</text>
  <line class="ar" x1="180" y1="244" x2="196" y2="244" marker-end="url(#ah2)"/>

  <!-- 2 核心算法 -->
  <g filter="url(#glow3)">
    <rect class="k-core" x="198" y="200" width="148" height="88" rx="9"/>
  </g>
  <text class="f-t2" x="272" y="236" text-anchor="middle" style="fill:#0F766E">核心算法</text>
  <text class="f-s" x="272" y="259" text-anchor="middle">多维调参</text>
  <text class="f-s" x="272" y="279" text-anchor="middle">循环补偿</text>
  <text class="f-file" x="272" y="308" text-anchor="middle">crop_camera_by_angle</text>
  <line class="ar" x1="348" y1="244" x2="364" y2="244" marker-end="url(#ah2)"/>

  <!-- 3 格式生成 -->
  <rect class="k-data" x="366" y="200" width="148" height="88" rx="9"/>
  <text class="f-t2" x="440" y="236" text-anchor="middle" style="fill:#3730A3">格式生成</text>
  <text class="f-s" x="440" y="259" text-anchor="middle">三件套 json</text>
  <text class="f-s" x="440" y="279" text-anchor="middle">自动计算</text>
  <text class="f-file" x="440" y="308" text-anchor="middle">generate_camera_files</text>
  <line class="ar" x1="516" y1="244" x2="532" y2="244" marker-end="url(#ah2)"/>

  <!-- 4 编码封装 -->
  <rect class="k-data" x="534" y="200" width="148" height="88" rx="9"/>
  <text class="f-t2" x="608" y="236" text-anchor="middle" style="fill:#3730A3">编码 &amp; 封装</text>
  <text class="f-s" x="608" y="259" text-anchor="middle">UWA 转换</text>
  <text class="f-s" x="608" y="279" text-anchor="middle">+ MP4 封装</text>
  <line class="ar" x1="684" y1="244" x2="700" y2="244" marker-end="url(#ah2)"/>

  <!-- 5 3DGS 壁纸产出 -->
  <rect class="k-out" x="702" y="200" width="148" height="88" rx="9"/>
  <text class="f-t2" x="776" y="243" text-anchor="middle" style="fill:#0F766E">3DGS 壁纸产出</text>
  <text class="f-s" x="776" y="268" text-anchor="middle" style="fill:#115E59">约束已内嵌</text>

  <!-- ── 下挂：MP4 解封装标签页（附加入口：琥珀虚线） ── -->
  <rect class="k-note" x="64" y="384" width="420" height="84" rx="10"/>
  <text class="f-t2" x="274" y="416" text-anchor="middle" style="fill:#92400E">MP4 解封装标签页</text>
  <text class="f-s" x="274" y="441" text-anchor="middle" style="fill:#92400E">从 MP4 反向提取 3DGS 模型与相机数据</text>
  <line class="ln-fb" x1="104" y1="382" x2="104" y2="292" marker-end="url(#ah-note)"/>
  <text class="f-xs" x="118" y="342" font-weight="700" style="fill:#B45309">反向解回参数</text>

  <defs>
    <marker id="ah2" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" style="fill:#475569"/>
    </marker>
    <marker id="ah-note" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" style="fill:#D97706"/>
    </marker>
    <filter id="glow3" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="b2"/>
      <feFlood flood-color="#5EEAD4" flood-opacity="0.30" result="c1"/>
      <feFlood flood-color="#0D9488" flood-opacity="0.20" result="c2"/>
      <feComposite in="c1" in2="b1" operator="in" result="g1"/>
      <feComposite in="c2" in2="b2" operator="in" result="g2"/>
      <feMerge>
        <feMergeNode in="g1"/><feMergeNode in="g2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
