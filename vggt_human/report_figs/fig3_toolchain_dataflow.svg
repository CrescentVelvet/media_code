<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-label="工具链数据流图"><style><![CDATA[

  :root{
    --ink:#0F172A; --ink-soft:#334155; --muted:#64748B; --faint:#94A3B8;
    --line:#CBD5E1; --line-soft:#E8EDF4; --bg:#E8EDF4; --card:#FFFFFF;
    /* 语义色板：靛蓝=数据 · 青=核心 · 琥珀=附加说明/反馈 */
    --indigo:#3730A3; --indigo-2:#818CF8; --indigo-soft:#EEF2FF;
    --teal:#0F766E; --teal-2:#0D9488; --teal-soft:#F6FFFD; --teal-mid:#99F6E4;
    --amber:#92400E; --amber-2:#F59E0B; --amber-soft:#FFFBEB; --amber-deep:#B45309;
    --red:#B91C1C; --red-2:#DC2626; --red-soft:#FFF8F7; --red-mid:#FEE2E2;
    --tip:#1E3A8A; --tip-line:#93C5FD; --tip-soft:#EFF6FF;
    --cyan:#0F766E; --cyan-2:#0D9488; --cyan-soft:#F6FFFD;
    --green:#0F766E; --green-soft:#99F6E4;
    --violet:#4F46E5; --violet-soft:#EEF2FF;
    /* 旧变量名转发到新色板，正文样式随之同步 */
    --blue:var(--teal); --blue-2:var(--teal-2); --blue-soft:var(--tip-soft);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:15.5px; line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1180px; margin:0 auto; padding:0 0 72px}
  .sheet{background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:34px 40px 30px; margin:22px 0; }
  .lead{box-shadow:0 1px 2px rgba(16,24,40,.04)}

  /* ── 页头 ── */
  .top{border-top:4px solid var(--blue); border-radius:14px 14px 14px 14px}
  .kicker{font-size:12.5px; letter-spacing:.14em; color:var(--blue);
          font-weight:600; text-transform:uppercase; margin:0 0 10px}
  h1{font-size:29px; line-height:1.3; margin:0 0 12px; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:14.5px; margin:0}
  .meta{margin-top:20px; padding-top:16px; border-top:1px dashed var(--line);
        display:flex; gap:28px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
  .meta b{color:var(--ink-soft); font-weight:600}

  /* ── 章节 ── */
  h2{font-size:20px; margin:0 0 6px; display:flex; align-items:baseline; gap:12px; letter-spacing:-.005em}
  h2 .num{font-size:13px; font-weight:700; color:#fff; background:var(--blue);
          border-radius:6px; padding:2px 9px; letter-spacing:.04em; position:relative; top:-2px}
  h3{font-size:16px; margin:26px 0 8px; color:var(--ink)}
  .sec-desc{color:var(--muted); font-size:14px; margin:0 0 20px}
  p{margin:0 0 12px}
  ul{margin:0 0 12px; padding-left:20px}
  li{margin:5px 0}
  li::marker{color:var(--faint)}
  code{font-family:ui-monospace,Consolas,"Courier New",monospace; font-size:.88em;
       background:var(--line-soft); border:1px solid var(--line); border-radius:4px; padding:1px 5px}
  .hl{background:linear-gradient(transparent 58%, #FDE68A 58%); font-weight:600}

  /* ── 结论卡片 ── */
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:4px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:16px 16px 14px;
        position:relative; overflow:hidden}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--teal-2)}
  .card.t::before{background:#4F46E5}
  .card.a::before{background:var(--amber-2)}
  .card.v::before{background:var(--red-2)}
  .card .t1{font-size:13px; color:var(--muted); margin:0 0 6px}
  .card .t2{font-size:15px; font-weight:600; line-height:1.5; margin:0; color:var(--ink)}

  /* ── 图卡 ── */
  figure{margin:22px 0 8px; border:1px solid var(--line); border-radius:12px;
         background:#FFFFFF; padding:18px 18px 10px; overflow:hidden}
  figure svg{display:block; width:100%; height:auto}
  figcaption{font-size:13px; color:var(--muted); text-align:center;
             padding:10px 0 6px; border-top:1px solid var(--line-soft); margin-top:12px}
  figcaption b{color:var(--ink-soft)}

  /* ── 表格 ── */
  table{width:100%; border-collapse:collapse; margin:14px 0 6px; font-size:14.5px}
  th,td{text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
  thead th{background:#F9FAFB; color:var(--ink-soft); font-weight:600; font-size:13.5px;
           border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:1px solid var(--line)}
  td.k{color:var(--muted); width:150px}
  .pill{display:inline-block; font-size:12.5px; padding:1px 9px; border-radius:20px;
        border:1px solid currentColor; line-height:1.7; white-space:nowrap}
  .pill.bad{color:var(--red); background:var(--red-mid)}
  .pill.ok{color:var(--green); background:var(--green-soft)}
  .pill.mid{color:var(--amber); background:var(--amber-soft)}

  /* ── 引用条 ── */
  .quote{margin:18px 0; padding:14px 18px; border-left:4px solid var(--tip-line);
         background:var(--tip-soft); border-radius:0 8px 8px 0; font-size:14.5px; color:var(--tip)}
  .quote b{color:var(--tip)}
  .note{margin:18px 0 0; padding:13px 16px; border:2px dashed var(--amber-2); border-radius:8px;
        background:var(--amber-soft); font-size:13.5px; color:var(--amber)}
  .note strong{color:var(--amber)}

  /* ── 附录 ── */
  details{border:1px solid var(--line); border-radius:12px; background:var(--card); margin:22px 0}
  summary{cursor:pointer; padding:16px 22px; font-weight:600; font-size:15px; color:var(--blue);
          list-style:none; display:flex; align-items:center; gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸"; color:var(--faint); transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details[open] summary{border-bottom:1px solid var(--line)}
  .dt-body{padding:8px 22px 20px}
  .dt-body h4{font-size:14.5px; margin:18px 0 6px; color:var(--ink)}

  @media print{
    body{background:#fff} .page{max-width:none} .sheet{break-inside:avoid; border:none; padding:0 0 18px}
    figure{break-inside:avoid} details{display:none}
  }
  @media (max-width:900px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .sheet{padding:24px 20px}
    h1{font-size:23px}
  }

  /* ══════ 图内样式（按 PPT 投影加固：文字加深、描边加粗、填充提浓）══════ */
  .f-t{font-size:14.5px; font-weight:700; fill:#0F172A}
  .f-t2{font-size:13px; font-weight:700; fill:#1E293B}
  .f-s{font-size:12px; fill:#334155}
  .f-xs{font-size:11px; fill:#64748B}
  .f-lbl{font-size:11px; font-weight:700; fill:#64748B; letter-spacing:.1em}
  .f-w{font-size:12.5px; fill:#FFFFFF; font-weight:600}
  .f-num{font-family:ui-monospace,Consolas,monospace; font-size:11.5px; font-weight:700}
  .fig-bg{fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.6}
  .ln{stroke:#CBD5E1; stroke-width:1.6; fill:none}
  .ar{stroke:#475569; stroke-width:2.2; fill:none}
  .ln-d{stroke:#64748B; stroke-width:1.2; fill:none; stroke-dasharray:4 3}

  /* 节点：普通 / 数据文件 / 核心 / 最终产出 / 附加说明 / 问题 / 改进后 / 强调提示 */
  .k-node{fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.6}
  .k-data{fill:#EEF2FF; stroke:#818CF8; stroke-width:1.6}
  .k-core{fill:#F6FFFD; stroke:#0D9488; stroke-width:2.5}
  .k-out{fill:#0D9488; stroke:#0F766E; stroke-width:2.5}
  .k-note{fill:#FFFBEB; stroke:#F59E0B; stroke-width:2.5; stroke-dasharray:6 5}
  .k-issue{fill:#FFF8F7; stroke:#DC2626; stroke-width:1.6}
  .k-issue-2{fill:#FEE2E2; stroke:#DC2626; stroke-width:2.5}
  .k-after{fill:#99F6E4; stroke:#0D9488; stroke-width:2.5}
  .k-tip{fill:#EFF6FF; stroke:#93C5FD; stroke-width:1.6}

  /* 连线：流程箭头 / 核心 / 反馈闭环 / 附加说明 / 问题 */
  .ln-data{stroke:#475569; stroke-width:2.2; fill:none}
  .ln-core{stroke:#0D9488; stroke-width:2.5; fill:none}
  .ln-core-d{stroke:#0D9488; stroke-width:2.5; fill:none; stroke-dasharray:6 5}
  .ln-fb{stroke:#D97706; stroke-width:2.2; fill:none; stroke-dasharray:6 5}
  .ln-issue{stroke:#DC2626; stroke-width:2.2; fill:none; stroke-dasharray:6 5}

  .dot-data{fill:#4F46E5}
  .dot-core{fill:#0D9488}
  .dot-note{fill:#F59E0B}
  .dot-issue{fill:#DC2626}


]]></style>
      <text class="f-lbl" x="30" y="30">图 3 ｜ TOOLCHAIN DATA FLOW</text>

      <!-- 主链：输入 → 核心算法 → 格式生成 → 编码封装 → 成品 -->
      <g>
        <rect class="k-data" x="55" y="206" width="190" height="88" rx="9"/>
        <text class="f-t2" x="150" y="240" text-anchor="middle" style="fill:#3730A3">输入数据</text>
        <text class="f-xs" x="150" y="262" text-anchor="middle" style="fill:#4F46E5">UWA 高斯模型</text>
        <text class="f-xs" x="150" y="280" text-anchor="middle" style="fill:#4F46E5">COLMAP ／ 实拍产出</text>
      </g>
      <line class="ar" x1="247" y1="250" x2="272" y2="250" marker-end="url(#ah2)"/>
      <g filter="url(#glow3)">
        <rect class="k-core" x="275" y="206" width="190" height="88" rx="9"/>
      </g>
      <text class="f-num" x="370" y="238" text-anchor="middle" style="fill:#0F766E;font-size:11px">crop_camera_by_angle.py</text>
      <text class="f-xs" x="370" y="260" text-anchor="middle" style="fill:#334155">核心算法 · 多维调参</text>
      <text class="f-xs" x="370" y="278" text-anchor="middle" style="fill:#334155">视线交汇 · 循环补偿</text>
      <line class="ar" x1="467" y1="250" x2="492" y2="250" marker-end="url(#ah2)"/>
      <g>
        <rect class="k-data" x="495" y="206" width="190" height="88" rx="9"/>
        <text class="f-num" x="590" y="238" text-anchor="middle" style="fill:#3730A3;font-size:11px">generate_camera_files.py</text>
        <text class="f-xs" x="590" y="260" text-anchor="middle" style="fill:#334155">UWA 格式自动生成</text>
        <text class="f-xs" x="590" y="278" text-anchor="middle" style="fill:#334155">三件套 json 自动计算</text>
      </g>
      <line class="ar" x1="687" y1="250" x2="712" y2="250" marker-end="url(#ah2)"/>
      <g>
        <rect class="k-data" x="715" y="206" width="190" height="88" rx="9"/>
        <text class="f-t2" x="810" y="242" text-anchor="middle" style="fill:#3730A3">编码 &amp; 封装</text>
        <text class="f-xs" x="810" y="264" text-anchor="middle" style="fill:#334155">UWA 编码转换 + MP4</text>
      </g>
      <line class="ar" x1="907" y1="250" x2="932" y2="250" marker-end="url(#ah2)"/>
      <g>
        <rect class="k-out" x="935" y="206" width="190" height="88" rx="9"/>
        <text class="f-t2" x="1030" y="240" text-anchor="middle" style="fill:#FFFFFF">3DGS 壁纸产出</text>
        <text class="f-xs" x="1030" y="262" text-anchor="middle" style="fill:#CCFBF1">约束已内嵌</text>
      </g>

      <!-- 上：可视化验证模块（核心环节，挂在核心算法之后） -->
      <line class="ar" x1="370" y1="204" x2="370" y2="162" marker-end="url(#ah2)"/>
      <rect class="k-core" x="310" y="76" width="560" height="84" rx="9"/>
      <text class="f-num" x="590" y="108" text-anchor="middle" style="fill:#0F766E;font-size:11.5px">visualize_cameras.py</text>
      <text class="f-xs" x="590" y="130" text-anchor="middle" style="fill:#334155">3D 空间分布 + 极坐标角度分布</text>
      <text class="f-xs" x="590" y="148" text-anchor="middle" style="fill:#334155">裁剪前后自动对比 → 300 dpi PNG（看图即验）</text>

      <!-- 下：MP4 解封装标签页（附加入口：琥珀虚线） -->
      <rect class="k-note" x="100" y="392" width="440" height="76" rx="9"/>
      <text class="f-t2" x="320" y="423" text-anchor="middle" style="fill:#92400E">MP4 解封装标签页</text>
      <text class="f-xs" x="320" y="447" text-anchor="middle" style="fill:#92400E">从 MP4 提取 3DGS 模型与相机数据（附加入口）</text>
      <line class="ln-fb" x1="150" y1="390" x2="150" y2="298" marker-end="url(#ah-note)"/>
      <text class="f-xs" x="162" y="346" font-weight="700" style="fill:#B45309">反向解回参数</text>

      <defs>
        <marker id="ah2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 Z" style="fill:#475569"/>
        </marker>
        <marker id="ah-note" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 Z" style="fill:#D97706"/>
        </marker>
        <filter id="glow3" x="-20%" y="-80%" width="140%" height="260%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b1"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b2"/>
          <feFlood flood-color="#5EEAD4" result="c1"/>
          <feFlood flood-color="#0D9488" result="c2"/>
          <feComposite in="c1" in2="b1" operator="in" result="g1"/>
          <feComposite in="c2" in2="b2" operator="in" result="g2"/>
          <feMerge>
            <feMergeNode in="g1"/><feMergeNode in="g1"/>
            <feMergeNode in="g2"/><feMergeNode in="g2"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>
