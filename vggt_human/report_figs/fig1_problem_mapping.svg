<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590" role="img" aria-label="问题映射图"><style><![CDATA[
  /* 图内样式（PPT 投影口径：字号 / 画布宽 ≥ 1.5%，投影等效 ≥ 14pt） */
  .f-t{font-size:19px; font-weight:700; fill:#0F172A}
  .f-t2{font-size:17px; font-weight:700; fill:#1E293B}
  .f-s{font-size:14px; fill:#334155}
  .f-xs{font-size:13px; fill:#64748B}
  .f-lbl{font-size:15px; font-weight:700; fill:#475569; letter-spacing:.12em}
  .fig-bg{fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.6}
  .k-issue{fill:#FFF8F7; stroke:#DC2626; stroke-width:1.6}
  .k-note{fill:#FFFBEB; stroke:#F59E0B; stroke-width:2.5; stroke-dasharray:6 5}
]]></style>
  <!-- 底色画在 SVG 内部（不用 body 规则），避免嵌入 HTML 时污染页面背景 -->
  <rect width="880" height="590" fill="#E8EDF4"/>

  <text class="f-lbl" x="30" y="32">图 1 ｜ PROBLEM MAPPING</text>

  <!-- ── 左：俯视示意 ── -->
  <rect class="fig-bg" x="30" y="46" width="460" height="520" rx="11"/>
  <text class="f-t" x="56" y="82">可观看视角 ≠ 重建质量良好视角</text>

  <!-- 几何图整体下移 30px 给顶部图例让位（中心实际 260,360） -->
  <g transform="translate(0,30)">
  <!-- 覆盖扇区（靛蓝 = 数据充分区）：方位角 a ∈ [-140°, 140°] -->
  <path d="M 260,330 L 160.3,448.7 A 155,155 0 1 1 359.7,448.7 Z" style="fill:#818CF8;fill-opacity:0.34"/>
  <!-- 越界扇区（红 = 数据不支撑）：a ∈ [140°, 220°] -->
  <path d="M 260,330 L 359.7,448.7 A 155,155 0 0 1 160.3,448.7 Z" style="fill:#DC2626;fill-opacity:0.24"/>

  <!-- 采集半径环 -->
  <circle cx="260" cy="330" r="155" style="fill:none;stroke:#818CF8;stroke-width:4;stroke-dasharray:4 3"/>
  <!-- 扇区边界（两条都是覆盖区边界，故同色） -->
  <line x1="260" y1="330" x2="160.3" y2="448.7" style="stroke:#4F46E5;stroke-width:4"/>
  <line x1="260" y1="330" x2="359.7" y2="448.7" style="stroke:#4F46E5;stroke-width:4"/>
  <!-- 越界扇区的外弧 -->
  <path d="M 359.7,448.7 A 155,155 0 0 1 160.3,448.7" style="fill:none;stroke:#DC2626;stroke-width:4;stroke-dasharray:7 6"/>

  <!-- 采集相机位姿 + 视线（8 个位姿均落在覆盖区内） -->
  <g style="stroke:#4F46E5;stroke-width:1.2;stroke-opacity:0.9">
    <line x1="260" y1="330" x2="141.3" y2="429.7"/>
    <line x1="260" y1="330" x2="105.6" y2="343.5"/>
    <line x1="260" y1="330" x2="125.8" y2="252.5"/>
    <line x1="260" y1="330" x2="194.4" y2="189.6"/>
    <line x1="260" y1="330" x2="287.0" y2="177.3"/>
    <line x1="260" y1="330" x2="369.6" y2="220.4"/>
    <line x1="260" y1="330" x2="412.7" y2="303.0"/>
    <line x1="260" y1="330" x2="400.4" y2="395.6"/>
  </g>
  <g style="fill:#4F46E5">
    <circle cx="141.3" cy="429.7" r="5"/><circle cx="105.6" cy="343.5" r="5"/>
    <circle cx="125.8" cy="252.5" r="5"/><circle cx="194.4" cy="189.6" r="5"/>
    <circle cx="287.0" cy="177.3" r="5"/><circle cx="369.6" cy="220.4" r="5"/>
    <circle cx="412.7" cy="303.0" r="5"/><circle cx="400.4" cy="395.6" r="5"/>
  </g>

  <!-- 越界视角（红） -->
  <line x1="260" y1="330" x2="260" y2="485" style="stroke:#DC2626;stroke-width:4;stroke-dasharray:4 3"/>
  <circle cx="260" cy="485" r="5.5" style="fill:#DC2626"/>

  <!-- 重建主体 -->
  <circle cx="260" cy="330" r="34" style="fill:#4F46E5;fill-opacity:0.22;stroke:#4F46E5;stroke-width:6"/>
  <circle cx="260" cy="330" r="5" style="fill:#3730A3"/>
  <text class="f-s" x="260" y="284" text-anchor="middle" font-weight="700" style="fill:#3730A3;stroke:#FFFFFF;stroke-width:3.5;paint-order:stroke">重建主体</text>
  </g>

  <!-- 图例（放在上半圆空白区，避免压住扇形） -->
  <rect x="56" y="104" width="22" height="4" rx="2" style="fill:#818CF8"/>
  <text class="f-s" x="88" y="110" font-weight="700" style="fill:#3730A3">采集覆盖区 · 数据充分，质量良好</text>
  <line x1="56" y1="130" x2="78" y2="130" style="stroke:#4F46E5;stroke-width:3"/>
  <text class="f-s" x="88" y="136" font-weight="700" style="fill:#3730A3">采集相机位姿（8 个视角）</text>
  <rect x="56" y="156" width="22" height="4" rx="2" style="fill:#DC2626"/>
  <text class="f-s" x="88" y="162" font-weight="700" style="fill:#B91C1C">越界区 · 模糊 / 伪影 / 穿模</text>
  <text class="f-xs" x="56" y="190">约束范围应落在靛蓝覆盖区内</text>
  <text class="f-xs" x="56" y="548">俯视示意（+Y 向上，重力对齐）</text>

  <!-- ── 右：三类症状 ── -->
  <rect class="fig-bg" x="510" y="46" width="340" height="520" rx="11"/>
  <text class="f-t" x="536" y="82">越界后稳定复现的三类观感问题</text>

  <!-- 症状 1 -->
  <rect class="k-issue" x="536" y="104" width="288" height="100" rx="9"/>
  <circle cx="566" cy="134" r="6" style="fill:#DC2626"/>
  <text class="f-t2" x="584" y="139" style="fill:#B91C1C">模糊</text>
  <text class="f-s" x="584" y="163">越界角度像素采样密度不足，</text>
  <text class="f-s" x="584" y="185">主体边缘发虚、细节塌陷</text>

  <!-- 症状 2 -->
  <rect class="k-issue" x="536" y="216" width="288" height="100" rx="9"/>
  <circle cx="566" cy="246" r="6" style="fill:#DC2626"/>
  <text class="f-t2" x="584" y="251" style="fill:#B91C1C">伪影</text>
  <text class="f-s" x="584" y="275">训练视角之外，3DGS 产生</text>
  <text class="f-s" x="584" y="297">漂浮高斯斑块，遮挡主体</text>

  <!-- 症状 3 -->
  <rect class="k-issue" x="536" y="328" width="288" height="100" rx="9"/>
  <circle cx="566" cy="358" r="6" style="fill:#DC2626"/>
  <text class="f-t2" x="584" y="363" style="fill:#B91C1C">穿模</text>
  <text class="f-s" x="584" y="387">未采集区域的背面几何暴露，</text>
  <text class="f-s" x="584" y="409">出现穿透与空洞</text>

  <!-- 结论条（附加说明：琥珀虚线） -->
  <rect class="k-note" x="536" y="442" width="288" height="100" rx="9"/>
  <text class="f-s" x="560" y="478" font-weight="700" style="fill:#92400E">结论：可观看视角必须收敛到</text>
  <text class="f-s" x="560" y="502">重建质量良好区间，观感才可控；</text>
  <text class="f-s" x="560" y="526" style="fill:#92400E">需工具级约束，而非后期或自觉。</text>
</svg>
