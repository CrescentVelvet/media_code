<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="1280" height="720" fill="#f8fafc"/>
<text x="640" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">DA3+2DGS per-scene 重建:总体架构(冻结骨干 + 双分支 + 有界 offset)</text>

<!-- frozen DA3 -->
<g>
  <rect x="40" y="90" width="220" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">多视角 RGB × N</text>
  <text x="150" y="140" text-anchor="middle" font-size="12" fill="#3b82f6">+ 相机内参</text>

  <rect x="40" y="210" width="220" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">DA3 骨干(冻结)</text>
  <text x="150" y="264" text-anchor="middle" font-size="12.5" fill="#334155">metric 深度 + 相机位姿</text>
  <text x="150" y="284" text-anchor="middle" font-size="12.5" fill="#334155">Apache 2.0,权重不复训</text>

  <rect x="40" y="360" width="220" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">anchor 点云构建</text>
  <text x="150" y="413" text-anchor="middle" font-size="12.5" fill="#334155">深度反投影 → 1/4 分辨率降采样</text>
  <text x="150" y="433" text-anchor="middle" font-size="12.5" fill="#334155">多视角一致性剔毒(τ 阈值)</text>
  <text x="150" y="453" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">→ 干净的"几何骨架"</text>

  <line x1="150" y1="160" x2="150" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="150" y1="310" x2="150" y2="356" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="170" y="172" width="90" height="22" rx="11" fill="#fff" stroke="#2563eb"/>
  <text x="215" y="188" text-anchor="middle" font-size="11.5" fill="#2563eb">冻结不复训</text>
</g>

<!-- offset box -->
<g>
  <rect x="330" y="330" width="200" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">有界 offset(核心创新)</text>
  <text x="430" y="386" text-anchor="middle" font-size="12.5" fill="#57534e">像素中心 offset: ±0.5~1 footprint</text>
  <text x="430" y="406" text-anchor="middle" font-size="12.5" fill="#57534e">深度 offset: ±1~2% of depth</text>
  <text x="430" y="426" text-anchor="middle" font-size="12.5" fill="#57534e">tanh 软界,全程稳定存在</text>
  <text x="430" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">吸收跨视角位姿错位 → 抑重影</text>

  <line x1="260" y1="400" x2="326" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="293" y="388" text-anchor="middle" font-size="11" fill="#64748b">逐点</text>
</g>

<!-- two branches -->
<g>
  <rect x="600" y="160" width="280" height="130" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="740" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">几何分支(低分辨率 1/4)</text>
  <text x="740" y="214" text-anchor="middle" font-size="12.5" fill="#334155">2DGS surfel:2D 尺度 + 法线</text>
  <text x="740" y="234" text-anchor="middle" font-size="12.5" fill="#334155">刻意低通 → 面元贴表面</text>
  <text x="740" y="254" text-anchor="middle" font-size="12.5" fill="#334155">点不逐像素乱飞</text>
  <text x="740" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">→ 抑 floater</text>

  <rect x="600" y="350" width="280" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">纹理分支(高分辨率 full)</text>
  <text x="740" y="404" text-anchor="middle" font-size="12.5" fill="#334155">SH 颜色 + 不透明度</text>
  <text x="740" y="424" text-anchor="middle" font-size="12.5" fill="#334155">不再背几何包袱</text>
  <text x="740" y="444" text-anchor="middle" font-size="12.5" fill="#334155">专攻清晰度</text>
  <text x="740" y="464" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">→ 解 QuerySplat 式"糊"</text>

  <line x1="530" y1="380" x2="596" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="530" y1="415" x2="596" y2="415" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="562" y="300" text-anchor="middle" font-size="11" fill="#64748b">中心经 offset 校正</text>
</g>

<!-- rasterize + losses + output -->
<g>
  <rect x="950" y="230" width="290" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1095" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">2DGS 光栅化(diff-surfel)</text>
  <text x="1095" y="284" text-anchor="middle" font-size="12.5" fill="#334155">ray-splat 距离渲染 → 合成新视角</text>

  <rect x="950" y="350" width="290" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1095" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">监督(训练视角)</text>
  <text x="1095" y="402" text-anchor="middle" font-size="12.5" fill="#334155">光度 L1 + SSIM</text>
  <text x="1095" y="422" text-anchor="middle" font-size="12.5" fill="#334155">2DGS 原生:depth-distortion</text>
  <text x="1095" y="442" text-anchor="middle" font-size="12.5" fill="#334155">+ normal-consistency</text>

  <rect x="950" y="510" width="290" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="1095" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">输出:干净场景 2DGS</text>
  <text x="1095" y="564" text-anchor="middle" font-size="12" fill="#334155">无 floater / 无重影 / 纹理清晰</text>

  <line x1="880" y1="230" x2="946" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="880" y1="415" x2="946" y2="398" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1095" y1="320" x2="1095" y2="346" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1095" y1="470" x2="1095" y2="506" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="1120" y="492" text-anchor="start" font-size="11" fill="#64748b">opacity 0.01 剪枝(v2 零成本嫁接)</text>
</g>

<!-- evidence footer -->
<rect x="40" y="640" width="1200" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="70" y="664" font-size="13" font-weight="700" fill="#0f172a">三方证据闭环:</text>
<text x="70" y="686" font-size="12.5" fill="#334155">QuerySplat(冻结 VGM + 去外观 -4.25 dB)✕ InfiniSplat v2(w/o G 几何微调反退化 -16.6%/-23.2%;w/ O 全开 offset 有害 0.2070→0.2826)✕ 同事内部实证(有界 offset 有效)→ 冻结 + 解耦 + 有界,三条独立证据指向同一设计</text>
</svg>
