<!-- risks -->
<rect x="50" y="580" width="1180" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="80" y="612" font-size="16" font-weight="700" fill="#0f172a">关键风险与对策(详见 EXPERIMENT_PLAN.md §5)</text>
<text x="80" y="642" font-size="12.5" fill="#334155">⚠ 毒 anchor → 建前多视角一致性筛选(τ 可调) · ⚠ offset 界难标定 → D1 直接扫{0~∞} · ⚠ 仍糊 → 先查纹理分支容量,别动几何(2DGS 只稳几何不给清晰度)</text>
<text x="80" y="668" font-size="12.5" fill="#334155">本期不做:前馈蒸馏(工业级训练成本)、动态物体(后续接 SAM3 visibility gating) · 数据硬要求:静态场景、≥4 视角、有内参</text>
