<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<defs>
  <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="1280" height="720" fill="#f8fafc"/>
<text x="640" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">为什么 floater / 重影会发生,有界 offset 为什么能止血</text>

<!-- LEFT: problem -->
<rect x="50" y="80" width="560" height="430" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="330" y="116" text-anchor="middle" font-size="19" font-weight="700" fill="#b91c1c">问题:跨视角位姿不一致(未修正)</text>

<!-- cameras -->
<g stroke="#64748b" fill="#e2e8f0">
  <rect x="90" y="150" width="46" height="32" rx="4"/>
  <path d="M136,158 l22,-10 v36 l-22,-10 z"/>
  <rect x="90" y="240" width="46" height="32" rx="4"/>
  <path d="M136,248 l22,-10 v36 l-22,-10 z"/>
</g>
<text x="105" y="222" font-size="12" fill="#64748b">视角 1</text>
<text x="105" y="312" font-size="12" fill="#64748b">视角 2</text>

<!-- rays -->
<line x1="158" y1="166" x2="330" y2="300" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.5"/>
<line x1="158" y1="256" x2="360" y2="330" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="236" y="196" font-size="11.5" fill="#64748b">各视角独立深度 → 反投影</text>

<!-- double surface (ghost) -->
<ellipse cx="400" cy="330" rx="150" ry="46" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<ellipse cx="428" cy="312" rx="150" ry="46" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="400" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">同一表面</text>
<text x="470" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">微错位副本 → 重影</text>

<!-- floaters -->
<g fill="#fca5a5" stroke="#dc2626" stroke-width="1.5">
  <circle cx="300" cy="200" r="7"/>
  <circle cx="520" cy="210" r="7"/>
  <circle cx="560" cy="280" r="7"/>
  <circle cx="250" cy="280" r="7"/>
</g>
<text x="430" y="200" font-anchor="start" font-size="12.5" font-weight="700" fill="#dc2626">自由空间伪点 → floater</text>

<!-- unconstrained arrows -->
<path d="M300,207 q30,-40 60,-20" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#ar2)"/>
<path d="M520,217 q30,-30 -10,-50" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#ar2)"/>
<text x="330" y="420" text-anchor="middle" font-size="13.5" fill="#334155">无约束:点可<b>任意漂移</b>、错位各自成面</text>
<text x="330" y="444" text-anchor="middle" font-size="12.5" fill="#64748b">3DGS 原版 / DA3-GS 微调几何 都会出现</text>
<text x="330" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">InfiniSplat v2 w/ O 实测:全开 offset 反害 —— DTU LPIPS 0.2070 → 0.2826(+36.5%)</text>

<!-- RIGHT: solution -->
<rect x="670" y="80" width="560" height="430" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<text x="950" y="116" text-anchor="middle" font-size="19" font-weight="700" fill="#047857">对策:anchor + 有界 offset(信任域)</text>

<!-- anchors with trust regions -->
<g>
  <line x1="730" y1="330" x2="1180" y2="330" stroke="#2563eb" stroke-width="3"/>
  <text x="955" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">DA3 反投影 anchor(唯一表面)</text>

  <g>
    <circle cx="800" cy="330" r="34" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="800" cy="330" r="4.5" fill="#065f46"/>
    <line x1="800" y1="330" x2="818" y2="318" stroke="#059669" stroke-width="2.5" marker-end="url(#ar2)"/>
    <text x="800" y="392" text-anchor="middle" font-size="11.5" fill="#047857">δ ≤ 界</text>
  </g>
  <g>
    <circle cx="955" cy="330" r="34" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="955" cy="330" r="4.5" fill="#065f46"/>
    <line x1="955" y1="330" x2="940" y2="344" stroke="#059669" stroke-width="2.5" marker-end="url(#ar2)"/>
  </g>
  <g>
    <circle cx="1110" cy="330" r="34" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="1110" cy="330" r="4.5" fill="#065f46"/>
    <line x1="1110" y1="330" x2="1126" y2="342" stroke="#059669" stroke-width="2.5" marker-end="url(#ar2)"/>
  </g>
  <text x="955" y="250" text-anchor="middle" font-size="12.5" fill="#334155">虚线圆 = 信任域(像素 footprint ~ ±0.5–1)</text>
  <text x="955" y="272" text-anchor="middle" font-size="12.5" fill="#334155">offset 用 tanh 软界,离开距离有上界</text>

  <!-- ghost absorbed -->
  <ellipse cx="975" cy="300" rx="90" ry="20" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
  <text x="1092" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#ea580c">错位被吸收为</text>
  <text x="1092" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="#ea580c">亚像素位移</text>
  <path d="M1005,300 q20,-14 36,-4" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#ar2)"/>
</g>
<text x="950" y="420" text-anchor="middle" font-size="13.5" fill="#334155">有界:点被<b>钉在 anchor 邻域</b>,伪点无生存空间</text>
<text x="950" y="444" text-anchor="middle" font-size="12.5" fill="#64748b">同一表面不再各自成面 → 重影消失</text>
<text x="950" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">vs QuerySplat 软 CD 正则:硬约束全程稳定,不受"20K 步后失稳"限制</text>

<!-- bottom: three constraint forms -->
<rect x="50" y="540" width="1180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="70" y="572" font-size="16" font-weight="700" fill="#0f172a">位置自由度的三种约束形态(三方证据):</text>

<rect x="80" y="592" width="330" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="245" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">① 锁死(0 自由度)· InfiniSplat v2</text>
<text x="245" y="641" text-anchor="middle" font-size="12" fill="#64748b">稳但僵硬,大错位修不动</text>

<rect x="475" y="592" width="330" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="640" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">② 软正则(瞬态 CD)· QuerySplat</text>
<text x="640" y="641" text-anchor="middle" font-size="12" fill="#64748b">仅前 20K 步有效,全程施加失稳</text>

<rect x="870" y="592" width="330" height="66" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
<text x="1035" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">③ 硬信任域(有界 offset)· 本方案 ★</text>
<text x="1035" y="641" text-anchor="middle" font-size="12" fill="#065f46">全程稳定 + 可修小错位 = 甜点区</text>
</svg>
