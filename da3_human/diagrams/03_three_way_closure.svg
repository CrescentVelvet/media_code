<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<defs>
  <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="1280" height="720" fill="#f8fafc"/>
<text x="640" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">三方工作各自证明了什么 —— 同一设计空间的三个角(互补,非重复)</text>

<!-- axes -->
<g>
  <text x="60" y="110" font-size="15" font-weight="700" fill="#334155">① 输入假设</text>
  <text x="60" y="240" font-size="15" font-weight="700" fill="#334155">② 位置自由度</text>
  <text x="60" y="370" font-size="15" font-weight="700" fill="#334155">③ 解耦方式</text>
  <text x="60" y="500" font-size="15" font-weight="700" fill="#334155">④ 形态 / 复现</text>
  <text x="60" y="610" font-size="15" font-weight="700" fill="#334155">⑤ 各自证明</text>
</g>

<!-- three cards -->
<g>
  <!-- v2 -->
  <rect x="240" y="86" width="300" height="560" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="240" y="86" width="300" height="44" rx="14" fill="#2563eb"/>
  <rect x="240" y="110" width="300" height="20" fill="#2563eb"/>
  <text x="390" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">InfiniSplat v2</text>

  <text x="260" y="168" font-size="12.5" font-weight="700" fill="#2563eb">pose-required</text>
  <text x="260" y="190" font-size="12.5" fill="#334155">训练需 GT 位姿</text>
  <text x="260" y="210" font-size="12.5" fill="#334155">scale-aligned 反投影</text>

  <text x="260" y="266" font-size="12.5" font-weight="700" fill="#2563eb">零(全锁死)</text>
  <text x="260" y="288" font-size="12.5" fill="#334155">w/ O 消融:全开有害</text>
  <text x="260" y="308" font-size="12.5" fill="#334155">DTU LPIPS 0.2070→0.2826</text>

  <text x="260" y="394" font-size="12.5" font-weight="700" fill="#2563eb">无显式解耦</text>
  <text x="260" y="416" font-size="12.5" fill="#334155">冻结几何 + 属性 Refiner</text>

  <text x="260" y="522" font-size="12.5" fill="#334155">3DGS / 前馈</text>
  <text x="260" y="542" font-size="12.5" fill="#b91c1c">训练闭源(Refiner 未放)</text>

  <text x="260" y="612" font-size="12.5" font-weight="700" fill="#0f172a">位置自由度存在下界:</text>
  <text x="260" y="632" font-size="12.5" fill="#0f172a">零与全开两个端点都受损</text>
</g>

<g>
  <!-- QS -->
  <rect x="570" y="86" width="300" height="560" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="570" y="86" width="300" height="44" rx="14" fill="#7c3aed"/>
  <rect x="570" y="110" width="300" height="20" fill="#7c3aed"/>
  <text x="720" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">QuerySplat</text>

  <text x="590" y="168" font-size="12.5" font-weight="700" fill="#7c3aed">pose-free</text>
  <text x="590" y="190" font-size="12.5" fill="#334155">VGM 自建坐标系</text>
  <text x="590" y="210" font-size="12.5" fill="#334155">双趟隔离 + Sim(3) 对齐</text>

  <text x="590" y="266" font-size="12.5" font-weight="700" fill="#7c3aed">软约束(瞬态 CD)</text>
  <text x="590" y="288" font-size="12.5" fill="#334155">仅前 20K 步有效</text>
  <text x="590" y="308" font-size="12.5" fill="#334155">全程施加反而失稳</text>

  <text x="590" y="394" font-size="12.5" font-weight="700" fill="#7c3aed">query 双分支</text>
  <text x="590" y="416" font-size="12.5" fill="#334155">几何/外观 token 解耦</text>
  <text x="590" y="436" font-size="12.5" fill="#334155">消融:去外观 -4.25 dB</text>

  <text x="590" y="522" font-size="12.5" fill="#334155">3DGS / 前馈</text>
  <text x="590" y="542" font-size="12.5" fill="#b91c1c">推理开源,VGM 非商用</text>

  <text x="590" y="612" font-size="12.5" font-weight="700" fill="#0f172a">属性解耦收益 +</text>
  <text x="590" y="632" font-size="12.5" fill="#0f172a">几何先验可插拔(VGGT↔Ω 打平)</text>
</g>

<g>
  <!-- colleague -->
  <rect x="900" y="86" width="300" height="560" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
  <rect x="900" y="86" width="300" height="44" rx="14" fill="#059669"/>
  <rect x="900" y="110" width="300" height="20" fill="#059669"/>
  <text x="1050" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">同事 DA3+2DGS(本方案)</text>

  <text x="920" y="168" font-size="12.5" font-weight="700" fill="#059669">per-scene</text>
  <text x="920" y="190" font-size="12.5" fill="#334155">多视角棚拍 + 位姿可得</text>
  <text x="920" y="210" font-size="12.5" fill="#334155">(COLMAP / DA3 自估)</text>

  <text x="920" y="266" font-size="12.5" font-weight="700" fill="#059669">有界 offset(信任域)</text>
  <text x="920" y="288" font-size="12.5" fill="#334155">像素中心 + 深度,tanh 软界</text>
  <text x="920" y="308" font-size="12.5" fill="#334155">v2 §16 点名的空白,实证有效</text>

  <text x="920" y="394" font-size="12.5" font-weight="700" fill="#059669">分辨率解耦</text>
  <text x="920" y="416" font-size="12.5" fill="#334155">低通几何 1/4(2DGS)</text>
  <text x="920" y="436" font-size="12.5" fill="#334155">高通纹理 full(SH+α)</text>

  <text x="920" y="522" font-size="12.5" fill="#334155">2DGS surfel / per-scene</text>
  <text x="920" y="542" font-size="12.5" font-weight="700" fill="#059669">组件全开源,3090 可跑</text>

  <text x="920" y="612" font-size="12.5" font-weight="700" fill="#0f172a">有界中间态有效:</text>
  <text x="920" y="632" font-size="12.5" fill="#0f172a">重影/floater 同时被抑制</text>
</g>

<!-- bottom conclusion -->
<rect x="60" y="664" width="1140" height="40" rx="10" fill="#0f172a"/>
<text x="640" y="690" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">闭环结论:几何先验要冻结 · 位置自由度要受限 · 属性要按梯度性质解耦 —— 三条独立证据指向同一设计</text>
</svg>
