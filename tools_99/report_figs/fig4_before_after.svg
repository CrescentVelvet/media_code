<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-label="改进前后验证链路对比图"><style><![CDATA[
  /* 图内样式（PPT 投影口径：字号 / 画布宽 ≥ 1.5%，投影等效 ≥ 14pt） */
  .f-t{font-size:19px; font-weight:700; fill:#0F172A}
  .f-t2{font-size:17px; font-weight:700; fill:#1E293B}
  .f-s{font-size:14px; fill:#334155}
  .f-cap{font-size:12px; fill:#64748B}
  .f-lbl{font-size:15px; font-weight:700; fill:#475569; letter-spacing:.12em}
  .ar{stroke:#475569; stroke-width:2.6; fill:none}
  .k-out{fill:#CCFBF1; stroke:#0D9488; stroke-width:2.5}
  .k-issue-2{fill:#FEE2E2; stroke:#DC2626; stroke-width:2.5}
  .k-after{fill:#99F6E4; stroke:#0D9488; stroke-width:2.5}
  .ln-fb{stroke:#D97706; stroke-width:2.6; fill:none; stroke-dasharray:6 5}
  .box-before{fill:#FFF8F7;stroke:#DC2626;stroke-width:2.5;stroke-dasharray:7 6}
  .box-after{fill:#F6FFFD;stroke:#0D9488;stroke-width:2.5;stroke-dasharray:7 6}
  .node-r{fill:#FFFFFF;stroke:#DC2626;stroke-width:1.6}
  .node-t{fill:#FFFFFF;stroke:#0D9488;stroke-width:2.5}
]]></style>
  <!-- 底色画在 SVG 内部（不用 body 规则），避免嵌入 HTML 时污染页面背景 -->
  <rect width="880" height="560" fill="#E8EDF4"/>

  <text class="f-lbl" x="30" y="32">图 4 ｜ BEFORE / AFTER</text>

  <!-- ── 上：改进前（红 = 问题） ── -->
  <rect class="box-before" x="30" y="46" width="820" height="218" rx="11"/>
  <text class="f-t2" x="52" y="80" style="fill:#B91C1C">改进前 · 第一版约束脚本</text>

  <rect class="node-r" x="52" y="94" width="140" height="76" rx="8"/>
  <text class="f-s" x="122" y="124" text-anchor="middle" font-weight="700" style="fill:#B91C1C">单一维度调参</text>
  <text class="f-cap" x="122" y="146" text-anchor="middle" style="fill:#B91C1C">改一维牵动其他</text>
  <line class="ar" x1="194" y1="132" x2="212" y2="132" marker-end="url(#ah3)"/>

  <rect class="node-r" x="214" y="94" width="140" height="76" rx="8"/>
  <text class="f-s" x="284" y="124" text-anchor="middle" font-weight="700" style="fill:#B91C1C">封装 MP4</text>
  <text class="f-cap" x="284" y="146" text-anchor="middle" style="fill:#B91C1C">必须完成整轮封装</text>
  <line class="ar" x1="356" y1="132" x2="374" y2="132" marker-end="url(#ah3)"/>

  <rect class="node-r" x="376" y="94" width="140" height="76" rx="8"/>
  <text class="f-s" x="446" y="124" text-anchor="middle" font-weight="700" style="fill:#B91C1C">导入手机</text>
  <text class="f-cap" x="446" y="146" text-anchor="middle" style="fill:#B91C1C">文件传输 + 上机安装</text>
  <line class="ar" x1="518" y1="132" x2="536" y2="132" marker-end="url(#ah3)"/>

  <rect class="node-r" x="538" y="94" width="140" height="76" rx="8"/>
  <text class="f-s" x="608" y="124" text-anchor="middle" font-weight="700" style="fill:#B91C1C">上机观看判断</text>
  <text class="f-cap" x="608" y="146" text-anchor="middle" style="fill:#B91C1C">手动转动逐角度确认</text>
  <line class="ar" x1="680" y1="132" x2="698" y2="132" marker-end="url(#ah3)"/>

  <rect class="k-issue-2" x="700" y="94" width="140" height="76" rx="8"/>
  <text class="f-s" x="770" y="124" text-anchor="middle" font-weight="700" style="fill:#B91C1C">不满意 → 回炉</text>
  <text class="f-cap" x="770" y="146" text-anchor="middle" style="fill:#B91C1C">从第一步重来</text>

  <!-- 回流弧 -->
  <path d="M 770,172 C 770,246 122,246 122,172" style="fill:none;stroke:#DC2626;stroke-width:2.2;stroke-dasharray:6 5"/>
  <path d="M 122,172 L 117.5,181 L 126.5,181 Z" style="fill:#DC2626"/>
  <text class="f-s" x="446" y="240" text-anchor="middle" font-weight="700" style="fill:#B91C1C">每验证一轮，都要重走完整条链路</text>

  <!-- ── 下：改进后（青 = 工具核心） ── -->
  <rect class="box-after" x="30" y="296" width="820" height="218" rx="11"/>
  <text class="f-t2" x="52" y="330" style="fill:#0F766E">改进后 · 标准化调整工具</text>

  <rect class="node-t" x="52" y="338" width="168" height="76" rx="8"/>
  <text class="f-s" x="136" y="368" text-anchor="middle" font-weight="700" style="fill:#0F766E">GUI 填写参数</text>
  <text class="f-cap" x="136" y="390" text-anchor="middle">三轴独立调整</text>
  <line class="ar" x1="222" y1="376" x2="238" y2="376" marker-end="url(#ah3)"/>

  <rect class="node-t" x="240" y="338" width="168" height="76" rx="8"/>
  <text class="f-s" x="324" y="368" text-anchor="middle" font-weight="700" style="fill:#0F766E">看图即验</text>
  <text class="f-cap" x="324" y="390" text-anchor="middle">300 dpi PNG</text>
  <line class="ar" x1="410" y1="376" x2="426" y2="376" marker-end="url(#ah3)"/>

  <rect class="node-t" x="428" y="338" width="168" height="76" rx="8"/>
  <text class="f-s" x="512" y="368" text-anchor="middle" font-weight="700" style="fill:#0F766E">生成 UWA 格式</text>
  <text class="f-cap" x="512" y="390" text-anchor="middle">三件套 json</text>
  <line class="ar" x1="598" y1="376" x2="614" y2="376" marker-end="url(#ah3)"/>

  <rect class="k-out" x="616" y="338" width="150" height="76" rx="8"/>
  <text class="f-s" x="691" y="368" text-anchor="middle" font-weight="700" style="fill:#0F766E">编码封装</text>
  <text class="f-cap" x="691" y="390" text-anchor="middle" style="fill:#115E59">3DGS 壁纸产出</text>
  <line class="ar" x1="768" y1="376" x2="784" y2="376" marker-end="url(#ah3)"/>

  <rect class="k-after" x="786" y="338" width="62" height="76" rx="8"/>
  <text class="f-cap" x="817" y="364" text-anchor="middle" font-weight="700" style="fill:#0F766E">单文件</text>
  <text class="f-cap" x="817" y="381" text-anchor="middle" font-weight="700" style="fill:#0F766E">exe</text>
  <text class="f-cap" x="817" y="400" text-anchor="middle" style="fill:#0F766E">点击即用</text>

  <!-- 调参闭环：看图验证 → 调整参数（琥珀粗虚线） -->
  <path class="ln-fb" d="M 324,414 C 324,442 136,442 136,414"/>
  <path d="M 136,414 L 131.5,423 L 140.5,423 Z" style="fill:#D97706"/>
  <text class="f-s" x="230" y="470" text-anchor="middle" font-weight="700" style="fill:#B45309">调参闭环：看图验证 → 调整参数</text>

  <text class="f-s" x="52" y="542" style="fill:#334155">对比要点：反馈回路从「封装—传输—上机」缩短为「看图确认」；工具不再依赖开发者本人操作。</text>

  <defs>
    <marker id="ah3" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" style="fill:#475569"/>
    </marker>
  </defs>
</svg>
