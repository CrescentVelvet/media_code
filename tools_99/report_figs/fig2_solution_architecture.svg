<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="800" viewBox="0 0 880 800" role="img" aria-label="相机位姿调整工具改进方案架构图"><style><![CDATA[
  /* 图内样式（PPT 投影口径：字号 / 画布宽 ≥ 1.5%，投影等效 ≥ 14pt） */
  .f-t{font-size:19px; font-weight:700; fill:#0F172A}
  .f-t2{font-size:17px; font-weight:700; fill:#1E293B}
  .f-s{font-size:14px; fill:#334155}
  .f-xs{font-size:13px; fill:#64748B}
  .f-lbl{font-size:15px; font-weight:700; fill:#475569; letter-spacing:.12em}
  .f-num{font-family:ui-monospace,Consolas,monospace; font-size:15px; font-weight:700}
  .f-mono{font-family:ui-monospace,Consolas,monospace; font-size:14px; font-weight:700}
  .ar{stroke:#475569; stroke-width:2.6; fill:none}
  .k-data{fill:#EEF2FF; stroke:#818CF8; stroke-width:1.6}
  .k-core{fill:#F6FFFD; stroke:#0D9488; stroke-width:2.5}
  .k-out{fill:#CCFBF1; stroke:#0D9488; stroke-width:2.5}
  .ln-data{stroke:#475569; stroke-width:2.6; fill:none}
  .ln-core{stroke:#0D9488; stroke-width:2.5; fill:none}
]]></style>
  <!-- 底色画在 SVG 内部（不用 body 规则），避免嵌入 HTML 时污染页面背景 -->
  <rect width="880" height="800" fill="#E8EDF4"/>

  <text class="f-lbl" x="30" y="32">图 2 ｜ SOLUTION ARCHITECTURE</text>

  <!-- ── 输入层（靛蓝 = 数据） ── -->
  <text class="f-lbl" x="30" y="72">INPUT ｜ 输入数据</text>
  <rect class="k-data" x="30" y="86" width="395" height="78" rx="10"/>
  <text class="f-t2" x="52" y="118" style="fill:#3730A3">UWA 高斯模型</text>
  <text class="f-s" x="52" y="147">camera.json ／ camera_crop.json</text>
  <rect class="k-data" x="455" y="86" width="395" height="78" rx="10"/>
  <text class="f-t2" x="477" y="118" style="fill:#3730A3">COLMAP ／ 实拍产出</text>
  <text class="f-s" x="477" y="147">重建相机位姿与采集角度分布</text>

  <!-- ── 汇流 ── -->
  <path class="ln-data" d="M 227.5,164 L 227.5,190 L 652.5,190 L 652.5,164"/>
  <line class="ar" x1="440" y1="190" x2="440" y2="216" marker-end="url(#ah)"/>

  <!-- ── 内核层：四模块按「算 → 看 → 生成 → 用」递进（2×2 阶梯流，青=核心，靛蓝=数据） ── -->
  <text class="f-lbl" x="30" y="228">MODULES ｜ 工具链模块</text>
  <text class="f-xs" x="258" y="228" style="fill:#94A3B8">算得准 → 看得见 → 生成得出 → 用得起来</text>
  <rect x="22" y="238" width="836" height="380" rx="14"
        style="fill:#F8FAFC;fill-opacity:0.9;stroke:#DFE5EC;stroke-width:1.4;stroke-dasharray:5 4"/>

  <!-- 01 核心算法 -->
  <g filter="url(#glow2)">
    <rect class="k-core" x="30" y="246" width="395" height="172" rx="10"/>
  </g>
  <text class="f-num" x="52" y="278" style="fill:#14B8A6">01</text>
  <text class="f-t2" x="80" y="278" style="fill:#0F766E">核心算法</text>
  <text class="f-mono" x="52" y="304" style="fill:#0F766E">crop_camera_by_angle.py</text>
  <line x1="52" y1="322" x2="403" y2="322" style="stroke:#99F6E4;stroke-width:1.6"/>
  <circle cx="58" cy="349" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="72" y="354">视线交汇最小二乘求目标点</text>
  <circle cx="58" cy="375" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="72" y="380">±180° 方位角循环补偿</text>
  <circle cx="58" cy="401" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="72" y="406">角度 / 高度 / 半径多维调整</text>

  <line class="ln-core" x1="429" y1="332" x2="453" y2="332" marker-end="url(#ah-s)"/>

  <!-- 02 可视化验证 -->
  <g filter="url(#glow2)">
    <rect class="k-core" x="455" y="246" width="395" height="172" rx="10"/>
  </g>
  <text class="f-num" x="477" y="278" style="fill:#14B8A6">02</text>
  <text class="f-t2" x="505" y="278" style="fill:#0F766E">可视化验证</text>
  <text class="f-mono" x="477" y="304" style="fill:#0F766E">visualize_cameras.py</text>
  <line x1="477" y1="322" x2="828" y2="322" style="stroke:#99F6E4;stroke-width:1.6"/>
  <circle cx="483" cy="349" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="497" y="354">3D 空间分布 + 极坐标角度分布</text>
  <circle cx="483" cy="375" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="497" y="380">裁剪前后自动对比</text>
  <circle cx="483" cy="401" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="497" y="406">输出 300 dpi PNG</text>

  <!-- 02 → 03：阶梯折下 -->
  <line class="ln-core" x1="652.5" y1="419" x2="652.5" y2="431" marker-end="url(#ah-s)"/>

  <!-- 03 UWA 格式生成 -->
  <rect class="k-data" x="30" y="434" width="395" height="172" rx="10"/>
  <text class="f-num" x="52" y="466" style="fill:#4F46E5">03</text>
  <text class="f-t2" x="80" y="466" style="fill:#3730A3">UWA 格式生成</text>
  <text class="f-mono" x="52" y="492" style="fill:#3730A3">generate_camera_files.py</text>
  <line x1="52" y1="510" x2="403" y2="510" style="stroke:#C7D2FE;stroke-width:1.6"/>
  <circle cx="58" cy="537" r="3" style="fill:#4F46E5"/>
  <text class="f-s" x="72" y="542">cameras_init.json ／ cameras_out.json</text>
  <circle cx="58" cy="563" r="3" style="fill:#4F46E5"/>
  <text class="f-s" x="72" y="568">view_params.json</text>
  <circle cx="58" cy="589" r="3" style="fill:#4F46E5"/>
  <text class="f-s" x="72" y="594">角度范围 / 包围盒 / 半径 自动计算</text>

  <line class="ln-core" x1="429" y1="520" x2="453" y2="520" marker-end="url(#ah-s)"/>

  <!-- 04 桌面图形工具 -->
  <g filter="url(#glow2)">
    <rect class="k-core" x="455" y="434" width="395" height="172" rx="10"/>
  </g>
  <text class="f-num" x="477" y="466" style="fill:#14B8A6">04</text>
  <text class="f-t2" x="505" y="466" style="fill:#0F766E">桌面图形工具</text>
  <text class="f-mono" x="477" y="492" style="fill:#0F766E">main.py</text>
  <line x1="477" y1="510" x2="828" y2="510" style="stroke:#99F6E4;stroke-width:1.6"/>
  <circle cx="483" cy="537" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="497" y="542">Tkinter GUI，参数界面化填写</text>
  <circle cx="483" cy="563" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="497" y="568">PyInstaller 打包单文件 exe</text>
  <circle cx="483" cy="589" r="3" style="fill:#14B8A6"/>
  <text class="f-s" x="497" y="594">调参闭环：看图验证 → 调整参数</text>

  <!-- ── 汇流 ── -->
  <path class="ln-data" d="M 227.5,618 L 227.5,644 L 652.5,644 L 652.5,618"/>
  <line class="ar" x1="440" y1="644" x2="440" y2="670" marker-end="url(#ah)"/>

  <!-- ── 输出层（靛蓝 = 数据产物，青 = 最终成品） ── -->
  <text class="f-lbl" x="30" y="686">OUTPUT ｜ 输出与交付</text>
  <rect class="k-data" x="30" y="700" width="253" height="84" rx="10"/>
  <text class="f-t2" x="52" y="732" style="fill:#3730A3">调整后相机</text>
  <text class="f-s" x="52" y="761">角度 / 高度 / 半径已调好</text>
  <line class="ar" x1="285" y1="742" x2="309" y2="742" marker-end="url(#ah)"/>

  <rect class="k-data" x="313" y="700" width="253" height="84" rx="10"/>
  <text class="f-t2" x="335" y="732" style="fill:#3730A3">编码 &amp; 封装</text>
  <text class="f-s" x="335" y="761">UWA 编码转换与 MP4 封装</text>
  <line class="ar" x1="568" y1="742" x2="592" y2="742" marker-end="url(#ah)"/>

  <rect class="k-out" x="596" y="700" width="253" height="84" rx="10"/>
  <text class="f-t2" x="618" y="732" style="fill:#0F766E">3DGS 壁纸产出</text>
  <text class="f-s" x="618" y="761" style="fill:#115E59">约束已内嵌，开箱即用</text>

  <defs>
    <marker id="ah" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" style="fill:#475569"/>
    </marker>
    <!-- 同层递进用固定尺寸小箭头（userSpaceOnUse，不随 stroke-width 放大） -->
    <marker id="ah-s" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,6 L0,12 Z" style="fill:#0D9488"/>
    </marker>
    <filter id="glow2" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="b2"/>
      <feFlood flood-color="#5EEAD4" flood-opacity="0.30" result="c1"/>
      <feFlood flood-color="#0D9488" flood-opacity="0.20" result="c2"/>
      <feComposite in="c1" in2="b1" operator="in" result="g1"/>
      <feComposite in="c2" in2="b2" operator="in" result="g2"/>
      <feMerge>
        <feMergeNode in="g1"/><feMergeNode in="g2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
